name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Vet and unit tests
        working-directory: backend
        run: |
          go vet ./...
          go test ./... -count=1 -short -timeout 10m

  backend-integration:
    needs: backend-unit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chatapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chatapp"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Integration tests (DB + //go:build integration)
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/chatapp?sslmode=disable
        run: go test -tags=integration ./... -count=1 -timeout 20m

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Lint and build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  e2e-playwright:
    needs: [backend-unit, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chatapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chatapp"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Playwright browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install chromium --with-deps
      - name: Playwright E2E
        working-directory: frontend
        env:
          CI: "true"
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/chatapp?sslmode=disable
        run: npm run test:e2e

  k6-spec:
    needs: backend-integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chatapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chatapp"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Start API for k6
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/chatapp?sslmode=disable
          REDIS_ADDR: ""
          JWT_SECRET: ci-k6-jwt-secret-must-be-32-bytes-min!!
          PORT: "8080"
        run: |
          nohup go run . > /tmp/k6-api.log 2>&1 &
          echo $! > /tmp/k6-api.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/health | grep -q ok; then
              echo "API ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/k6-api.log || true
          exit 1
      - name: k6（単一シナリオ: health〜送信・既読）
        run: |
          docker run --rm --network=host \
            -v "${GITHUB_WORKSPACE}/k6:/k6:ro" \
            -e K6_API_BASE_URL=http://127.0.0.1:8080 \
            -e K6_VUS=3 \
            -e K6_DURATION=25s \
            grafana/k6:0.55.0 run /k6/scenarios/spec_api.js
      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/k6-api.pid ]; then kill $(cat /tmp/k6-api.pid) 2>/dev/null || true; fi
