services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatapp"]
      interval: 3s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-runtime
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/chatapp?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: change-this-to-a-secret-at-least-32-characters-long
      PUBLIC_ROOT: /app/data/public
      PORT: "8080"
      PUBLIC_APP_URL: http://localhost
      # REQUIRE_EMAIL_VERIFY: "1"
    volumes:
      - uploads:/app/data/public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-seed:
        condition: service_completed_successfully

  backend-seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-runtime
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/chatapp?sslmode=disable
      TEST_USER_PASSWORD: password123
      SEED_TEST_USER_TEAM: "1"
      SEED_TEST_USER_RESET: "0"
    command: ["./seed", "dev", "-team"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-runtime
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
